name: Keep Streamlit apps awake

on:
  schedule:
    - cron: "17 */4 * * *"   # every 4 hours; Streamlit sleeps an app after ~12 hours without visitors
  workflow_dispatch:          # "Run workflow" button for a manual wake-up

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: python .github/wake.py
